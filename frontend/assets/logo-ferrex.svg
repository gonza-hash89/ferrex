<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#17FF00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D400;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Casco con engranaje -->
  <g transform="translate(10, 5)">
    <!-- Casco -->
    <path d="M20 5 Q35 5 35 15 L35 25 Q35 30 30 30 L10 30 Q5 30 5 25 L5 15 Q5 10 10 10 L20 10" fill="#161B22" stroke="url(#neonGrad)" stroke-width="2"/>
    <path d="M15 12 L15 22" stroke="url(#neonGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M25 12 L25 22" stroke="url(#neonGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <!-- Engranaje dentro del casco -->
    <circle cx="20" cy="18" r="6" fill="none" stroke="url(#neonGrad)" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="3" fill="url(#neonGrad)"/>
    <g stroke="url(#neonGrad)" stroke-width="1.5" stroke-linecap="round">
      <line x1="20" y1="12" x2="20" y2="10"/>
      <line x1="20" y1="26" x2="20" y2="28"/>
      <line x1="14" y1="18" x2="12" y2="18"/>
      <line x1="28" y1="18" x2="30" y2="18"/>
      <line x1="16" y1="14" x2="14.5" y2="12.5"/>
      <line x1="25.5" y1="12.5" x2="27" y2="11"/>
      <line x1="14.5" y1="23.5" x2="13" y2="25"/>
      <line x1="25.5" y1="23.5" x2="27" y2="25"/>
    </g>
  </g>
  <!-- Texto FERREX con X en neón -->
  <text x="55" y="38" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="32" fill="#FFFFFF" text-anchor="start" letter-spacing="1">
    <tspan>FERRE</tspan>
    <tspan fill="url(#neonGrad)" font-weight="900">X</tspan>
  </text>
</svg>